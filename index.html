<title>Hỗ trợ học sinh gặp khó khăn trong môn Toán ở các lớp 3-6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F7; --surface:#FFFFFF; --surface2:#E9F0F2; --ink:#14222B; --muted:#566673; --line:#D0DBE0;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#D9EFEC; --mark:#D2501C; --mark-soft:#FBE5DA;
  --good:#1F8A4C; --good-soft:#DDF3E5; --bad:#B93A2C; --bad-soft:#FBE3DF; --warn:#9A6A0C;
  --tile1:#8FD3CC; --tile2:#5DB8B0;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E181D; --surface:#15232A; --surface2:#1C2E36; --ink:#E5EDF0; --muted:#93A6B0; --line:#2B3F48;
    --accent:#4FD1C5; --accent-ink:#06211F; --accent-soft:#16403E; --mark:#FF8A5B; --mark-soft:#3B2519;
    --good:#5FD28C; --good-soft:#16362399; --bad:#FF7F70; --bad-soft:#40201C; --warn:#E6B450;
    --tile1:#2E7C76; --tile2:#3E9D95;
  }
}
:root[data-theme="dark"]{
  --bg:#0E181D; --surface:#15232A; --surface2:#1C2E36; --ink:#E5EDF0; --muted:#93A6B0; --line:#2B3F48;
  --accent:#4FD1C5; --accent-ink:#06211F; --accent-soft:#16403E; --mark:#FF8A5B; --mark-soft:#3B2519;
  --good:#5FD28C; --good-soft:#16362399; --bad:#FF7F70; --bad-soft:#40201C; --warn:#E6B450;
  --tile1:#2E7C76; --tile2:#3E9D95;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
p{margin:0 0 .6em}
a{color:var(--accent)}
.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 56px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:6px 18px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{font:700 21px/1.2 var(--sans)}
.appname{font:800 25px/1.2 var(--sans);color:var(--accent);text-wrap:balance;margin:2px 0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.prog{margin-bottom:16px}
.prog .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.prog small{color:var(--muted);font:500 12px var(--mono)}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps li{position:relative}
.steps li::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--line)}
.steps li:first-child::before{top:50%}
.steps li:last-child::before{bottom:50%}
.stp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px 7px 0;cursor:pointer;border-radius:8px;position:relative}
.stp .node{flex:none;width:32px;height:32px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font:600 13px var(--mono);z-index:1;color:var(--muted)}
.stp .lab{display:flex;flex-direction:column;line-height:1.3;font-weight:600;font-size:14px}
.stp .lab small{color:var(--muted);font-weight:400;font-size:12px}
[data-lang="both"] .stp .lab .bi.in .en{display:block;font-weight:400;font-size:12px;color:var(--muted)}
[data-lang="both"] .stp .lab .bi.in .en::before{content:""}
.btn.pri .bi .en,.seg .bi .en{color:inherit;opacity:.85}
.stp[aria-current="step"] .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stp.done .node{border-color:var(--good);color:var(--good)}
.stp:hover .lab{color:var(--accent)}
.stp.extra{margin-top:10px}
.stp.extra .node{border-style:dashed}
main{min-width:0}
.hero{padding:22px 24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.hero .tabtag{font:500 12px var(--mono);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.hero h2{font:800 28px/1.2 var(--sans);margin:6px 0 8px}
.hero p{color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.panel>h3{font:700 18px var(--sans);margin-bottom:10px}
.panel h4{font:700 15px var(--sans);margin:16px 0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 10px 10px 0;margin:12px 0}
.callout.warn{border-color:var(--mark);background:var(--mark-soft)}
.quote{font-size:16px;font-weight:500}
.bi .en{display:block;color:var(--muted);font-size:.9em}
.bi.in .en{display:inline}
.bi.in .en::before{content:" · "}
[data-lang="vi"] .en{display:none}
[data-lang="en"] .vi{display:none}
[data-lang="en"] .bi .en{color:inherit;font-size:1em}
[data-lang="en"] .bi.in .en::before{content:""}
ol.plain,ul.plain{margin:0;padding-left:1.2em}
ol.plain li,ul.plain li{margin-bottom:.5em}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tw{overflow-x:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
label.f>span.bi .en{font-weight:400}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;font-weight:400;font-size:14px}
textarea{resize:vertical;min-height:70px}
input[type=range]{width:100%;accent-color:var(--accent)}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.1;font:500 .92em var(--mono)}
.fr i{font-style:normal;padding:0 .25em}
.fr i:first-child{border-bottom:1.6px solid currentColor}
.mx{display:inline-flex;align-items:center;gap:.2em}
.big .fr,.big{font-size:1.3em}
.chip{display:inline-block;font:500 12px var(--mono);padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mark{background:var(--mark-soft);color:var(--mark)}
.svgbox{background:var(--surface2);border-radius:10px;padding:6px;overflow-x:auto}
.svgbox svg{display:block;width:100%;min-width:560px;height:auto}
svg text{font-family:var(--mono)}
.ax{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.tk{stroke:var(--muted);stroke-width:2}
.tk2{stroke:var(--accent);stroke-width:2}
.bm{stroke:var(--mark);stroke-width:3}
.bl{fill:var(--ink);font-size:20px;font-weight:600}
.sm-t{fill:var(--muted);font-size:14px}
.tile1{fill:var(--tile1);stroke:var(--surface);stroke-width:2}
.tile2{fill:var(--tile2);stroke:var(--surface);stroke-width:2}
.tile-t{fill:var(--ink);font-size:15px;font-weight:500}
.pt{fill:var(--accent)}
.ptl{fill:var(--accent);font-size:22px;font-weight:600}
.exact{stroke:var(--mark);stroke-width:3;stroke-dasharray:6 5}
.arc1{fill:none;stroke:var(--accent);stroke-width:4}
.arc2{fill:none;stroke:var(--mark);stroke-width:4}
.arw1{fill:var(--accent)}
.arw2{fill:var(--mark)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.info>div{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px}
.info>div>b:first-child{display:block;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.info .v{font-size:17px;font-weight:600}
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.q .qt{font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.why{font-size:13.5px;margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--surface2)}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;background:var(--surface)}
summary{cursor:pointer;font-weight:600}
.cardbig{display:inline-grid;place-items:center;min-width:120px;min-height:96px;padding:10px 24px;border:3px solid var(--ink);border-radius:12px;background:var(--surface);font:600 40px var(--mono)}
.cardbig .fr{font-size:1em}
.steplist{display:grid;gap:8px;counter-reset:s;margin:0;padding:0;list-style:none}
.steplist li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:10px 12px;background:var(--surface2);border-radius:10px}
.steplist li::before{counter-increment:s;content:counter(s);font:600 14px var(--mono);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.steplist .tm{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:9}
.gl-item{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl-item b{font-weight:600}
.pill-links a{display:inline-block;margin:0 8px 8px 0;padding:6px 12px;border:1px solid var(--line);border-radius:99px;text-decoration:none;font-size:13.5px;background:var(--surface)}
.pill-links a:hover{border-color:var(--accent)}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px}
  aside{position:static}
  .steps{display:flex;overflow-x:auto;gap:4px;padding-bottom:6px}
  .steps li{flex:none}
  .steps li::before{display:none}
  .stp{padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
  .stp .lab small{display:none}
  .stp.extra{margin-top:0}
  .hero h2{font-size:23px}
  .gl-item{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* ---- multi-module additions ---- */
.mods{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.mods button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;line-height:1.25;font-weight:600;font-size:13.5px}
.mods button small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.mods button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mods button[aria-current="true"] small{color:inherit;opacity:.85}
.mods .mdone{font:600 11px var(--mono);margin-left:6px}
.sortbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.cat{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:120px;cursor:pointer;background:var(--surface)}
.cat.hot{border-color:var(--accent);background:var(--accent-soft)}
.cat h5{margin:0 0 8px;font:600 13px var(--sans)}
.tray{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--surface2);border-radius:12px;min-height:64px}
.sc{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;gap:4px;font:500 15px var(--mono)}
.sc.sel{border-color:var(--mark);box-shadow:0 0 0 3px var(--mark-soft)}
.sc.ok{border-color:var(--good);background:var(--good-soft)}
.sc.no{border-color:var(--bad);background:var(--bad-soft)}
.blk{display:inline-block;vertical-align:bottom}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;cursor:pointer;font-size:13px}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chipbtn.good{background:var(--good-soft);border-color:var(--good)}
.chipbtn.bad{background:var(--bad-soft);border-color:var(--bad)}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.flow span{padding:4px 10px;border-radius:99px;background:var(--surface2);font-size:13px}
.flow span.on{background:var(--accent);color:var(--accent-ink)}
.flow span.done{background:var(--good-soft);color:var(--good)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--accent);display:inline-block}
.dots i.b{background:var(--mark)}
.dots i.g{background:var(--line)}
.grp{border:2px solid var(--ink);border-radius:8px;padding:6px;display:inline-flex;flex-wrap:wrap;gap:3px;max-width:130px;background:var(--surface)}
.grp i{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block}
.qmark{fill:var(--mark);font-weight:700}
.bar1{fill:var(--tile1);stroke:var(--ink);stroke-width:2}
.bar2{fill:var(--mark-soft);stroke:var(--mark);stroke-width:2}
.barq{fill:none;stroke:var(--mark);stroke-width:3;stroke-dasharray:6 5}
.kbd{font:500 12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface2)}
.hi{background:var(--good-soft);border-radius:4px;padding:0 3px}
.lo{background:var(--bad-soft);border-radius:4px;padding:0 3px}
.mid{font-weight:600}
.err{position:fixed;left:8px;right:8px;bottom:8px;background:var(--bad);color:#fff;padding:8px 12px;border-radius:8px;font:12px var(--mono);z-index:20;white-space:pre-wrap}
[hidden]{display:none!important}
.svgbox svg.blk{display:inline-block;width:auto;min-width:0;height:auto;vertical-align:bottom}
.chipbtn[aria-pressed="true"] .bi .en,.mods button[aria-current="true"] .bi .en,.flow span.on .bi .en,.btn.pri .bi .en{color:inherit;opacity:.9}
@media (max-width:860px){.mods button small{display:none}}
</style>

<div class="app" id="app" data-lang="both">
  <div class="top">
    <div class="brand">
      <span class="eyebrow">Mathematics Intervention Toolkit · REL 2026-004 · Grades 3–6</span>
      <div class="appname">Hỗ trợ học sinh gặp khó khăn trong môn Toán ở các lớp 3-6</div>
      <h1 id="ttl"></h1>
    </div>
    <div class="seg" role="group" aria-label="Language / Ngôn ngữ">
      <button data-act="lang" data-v="both">VI + EN</button>
      <button data-act="lang" data-v="vi">Tiếng Việt</button>
      <button data-act="lang" data-v="en">English</button>
    </div>
  </div>
  <nav class="mods" id="mods" aria-label="Modules"></nav>
  <div class="layout">
    <aside>
      <div class="prog" id="prog"></div>
      <ol class="steps" id="steps"></ol>
    </aside>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
window.__errs=[];window.addEventListener('error',function(e){window.__errs.push((e.message||'error')+' @'+(e.filename||'').split('/').pop()+':'+e.lineno+':'+e.colno);});
</script>

function D(){var k=cur.key;if(!S.d[k])S.d[k]={};return S.d[k];}
function getP(p){var o=D(),a=p.split('.');for(var i=0;i<a.length;i++){if(o==null)return undefined;o=o[a[i]];}return o;}
function setP(p,v){var o=D(),a=p.split('.');for(var i=0;i<a.length-1;i++){if(o[a[i]]==null||typeof o[a[i]]!=='object')o[a[i]]={};o=o[a[i]];}o[a[a.length-1]]=v;}
function WS(){if(!W[cur.key])W[cur.key]={};return W[cur.key];}
function curTab(){return S.tabs[cur.key]||0;}
function isDone(m,i){return !!S.done[m.key+':'+i];}
/* ================= shared components ================= */
function noteBox(path,label,rows){return '<label class="f"><span>'+label+'</span><textarea data-k="'+path+'" rows="'+(rows||3)+'">'+esc(getP(path)||'')+'</textarea></label>';}
function panel(titleHTML,inner){return '<div class="panel">'+(titleHTML?'<h3>'+titleHTML+'</h3>':'')+inner+'</div>';}
function callout(inner,warn){return '<div class="callout'+(warn?' warn':'')+'">'+inner+'</div>';}
function hero(vi,en,lvi,len){var t=cur.tabs[curTab()];return '<div class="hero"><div class="tabtag">'+esc(t.tag)+' · '+P(t.vi,t.en)+'</div><h2>'+T(vi,en)+'</h2>'+(lvi?'<p>'+T(lvi,len)+'</p>':'')+'</div>';}
function doneBtn(i){var last=i>=cur.tabs.length-1;return '<div class="row end"><button class="btn'+(isDone(cur,i)?'':' pri')+'" data-act="done" data-i="'+i+'">'+(isDone(cur,i)?'✓ '+I('Đã hoàn thành — bỏ đánh dấu','Marked done — undo'):I('Đánh dấu hoàn thành','Mark as done'))+'</button>'+(last?'':'<button class="btn" data-act="go" data-i="'+(i+1)+'">'+I('Tab tiếp theo','Next tab')+' →</button>')+'</div>';}
function list(items,ordered){return '<'+(ordered?'ol':'ul')+' class="plain">'+items.map(function(x){return '<li>'+T(x[0],x[1])+'</li>';}).join('')+'</'+(ordered?'ol':'ul')+'>';}
function videoLinks(arr){return '<div class="pill-links">'+arr.map(function(v){return '<a href="'+v[0]+'" target="_blank" rel="noopener">▶ '+esc(v[1])+'</a>';}).join('')+'</div><p style="font-size:13px;color:var(--muted)">'+T('Video mở ở tab mới (tiếng Anh). Khi xem, ghi lại vào các ô dưới đây.','Videos open in a new tab. As you watch, note your observations below.')+'</p>';}
function stepList(steps){return '<ol class="steplist">'+steps.map(function(s){return '<li><div>'+T(s.vi,s.en)+'</div><span class="tm">'+esc(s.tm||'')+'</span></li>';}).join('')+'</ol>';}
function accordion(items){return items.map(function(c,i){return '<details><summary>'+T(c.q[0],c.q[1])+'</summary><p>'+T(c.a[0],c.a[1])+'</p>'+(c.extra||'')+noteBox('chal.'+i,T('Ý kiến của bạn','Add your ideas'))+'</details>';}).join('');}
/* ---------- knowledge checks ---------- */
function qHTML(key,q){
  var full=cur.key+':'+key;QS[full]=q;var sel=S.kc[full],has=sel!==undefined;
  var h='<div class="q" data-qk="'+full+'"><div class="qt">'+T(q.vi,q.en)+'</div>';
  q.o.forEach(function(o,i){var cls='opt';if(has){if(i===q.a)cls+=' ok';else if(i===sel)cls+=' no';}
    h+='<button class="'+cls+'" data-act="ans" data-key="'+full+'" data-i="'+i+'">'+T(o[0],o[1])+'</button>';});
  if(has)h+='<div class="why"><b>'+(sel===q.a?P('Đúng. ','Correct. '):P('Chưa đúng. ','Not quite. '))+'</b>'+T(q.wv,q.we)+'</div>';
  return h+'</div>';}
function kcBlock(prefix,qs){return qs.map(function(q,i){return qHTML(prefix+i,q);}).join('');}
function kcScore(m){var ok=0,tot=0;Object.keys(S.kc).forEach(function(k){if(k.indexOf(m.key+':')===0){tot++;var q=QS[k];if(q&&S.kc[k]===q.a)ok++;}});return [ok,tot];}
/* ---------- copy ---------- */
function copyOut(id,text){var ta=$('#'+id);ta.value=text;ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){toast(P('Đã sao chép','Copied'));},function(){});}catch(e){}
  toast(ok?P('Đã sao chép','Copied'):P('Nhấn Ctrl+C để sao chép','Press Ctrl+C to copy'));}
function sumBox(kind){return '<div class="row"><button class="btn pri" data-act="sum" data-kind="'+kind+'">'+I('Tạo bản tóm tắt','Create summary')+'</button></div><textarea id="out-'+kind+'" readonly rows="8" style="margin-top:10px" placeholder="…"></textarea>';}

function summaryTry(){
  var c=cur.cfg.try,pl=D().plan||{},si=pl.set||0,set=c.sets[si],t=[];
  t.push(cur.short[0].toUpperCase()+' — '+L('Tóm tắt buổi dạy','Routine summary'));
  t.push((pl.cls?L('Lớp: ','Class: ')+pl.cls+' · ':'')+(pl.date?L('Ngày: ','Date: ')+pl.date+' · ':'')+L(set.vi,set.en));t.push('');
  t.push(L('Quan sát:','Observations:'));var cnt={ok:0,hint:0,no:0};
  set.items.forEach(function(c,i){var key='l'+si+'_'+i,r=getP('log.'+key+'.r'),n=getP('log.'+key+'.n');if(r)cnt[r]++;t.push('- '+c.txt()+': '+(r==='ok'?L('đúng ngay','right away'):r==='hint'?L('cần gợi ý','needed prompting'):r==='no'?L('chưa đúng','incorrect'):'—')+(n?' ('+n+')':''));});
  t.push('');t.push(L('Tổng: ','Totals: ')+cnt.ok+' '+L('đúng ngay','right away')+', '+cnt.hint+' '+L('cần gợi ý','prompted')+', '+cnt.no+' '+L('chưa đúng','incorrect'));
  if(pl.pred){t.push('');t.push(L('Dự đoán ban đầu: ','Initial prediction: ')+pl.pred);}
  return t.join('\n');}

/* ================= sorter widget (shared) ================= */
/* cfg: {id, cats:[{k,vi,en}], cards:[{id,html,cat,vi,en}], starter:{vi,en}} */
function sorterState(id,cfg){var w=WS();if(!w.sort)w.sort={};if(!w.sort[id])w.sort[id]={assign:{},sel:null,checked:false,cfg:cfg};w.sort[id].cfg=cfg;return w.sort[id];}
function sorterHTML(id,cfg){
  var st=sorterState(id,cfg),tray=cfg.cards.filter(function(c){return !st.assign[c.id];});
  var h='<div class="sorter" data-sorter="'+id+'">';
  h+='<div class="tray" data-act="sortback" data-sid="'+id+'" aria-label="tray">'+(tray.length?tray.map(function(c){return sc(id,c,st);}).join(''):'<span style="color:var(--muted);font-size:13px">'+P('Đã xếp hết thẻ.','All cards placed.')+'</span>')+'</div>';
  h+='<div class="sortbox">'+cfg.cats.map(function(k){var inside=cfg.cards.filter(function(c){return st.assign[c.id]===k.k;});
    return '<div class="cat'+(st.sel?' hot':'')+'" data-act="sortput" data-sid="'+id+'" data-cat="'+k.k+'" role="button" tabindex="0"><h5>'+T(k.vi,k.en)+'</h5><div class="flow" style="gap:8px">'+inside.map(function(c){return sc(id,c,st);}).join('')+'</div></div>';}).join('')+'</div>';
  var placed=cfg.cards.length-tray.length;
  h+='<div class="row"><button class="btn pri" data-act="sortcheck" data-sid="'+id+'"'+(placed<cfg.cards.length?' disabled':'')+'>'+I('Kiểm tra đáp án','Check answers')+'</button><button class="btn" data-act="sortreset" data-sid="'+id+'">'+I('Xếp lại','Reset')+'</button><span style="font-size:13px;color:var(--muted)">'+placed+' / '+cfg.cards.length+'</span></div>';
  if(st.checked){var ok=0;cfg.cards.forEach(function(c){if(st.assign[c.id]===c.cat)ok++;});
    h+=callout('<b>'+ok+' / '+cfg.cards.length+'</b> '+P('thẻ xếp đúng.','cards placed correctly.')+(cfg.starter?'<br>'+T(cfg.starter.vi,cfg.starter.en):''),ok<cfg.cards.length);
    h+='<div class="tw"><table><tbody>'+cfg.cards.map(function(c){var right=st.assign[c.id]===c.cat;var catO=cfg.cats.filter(function(k){return k.k===c.cat;})[0];return '<tr><td style="white-space:nowrap">'+c.html()+'</td><td>'+(right?'<span class="chip good">✓</span>':'<span class="chip bad">✗</span>')+'</td><td>'+(right?'':P('Đúng là: ','Correct: ')+'<b>'+P(catO.vi,catO.en)+'</b>. ')+T(c.vi,c.en)+'</td></tr>';}).join('')+'</tbody></table></div>';}
  return h+'</div>';
}

var VOC_EN=['numerator','denominator','unit fraction','greater than','less than','equivalent','simplest form','improper fraction','mixed number','ones','tens','hundreds','thousands','digit','place value','least','greatest','tenths','hundredths','decimal point','regroup','simplify','commutative','factor','product','polygon','sides','vertices','equal','value','fraction','decimal'];
var VOC_VI=['tử số','mẫu số','phân số đơn vị','lớn hơn','nhỏ hơn','bằng nhau','tối giản','phân số','hỗn số','hàng đơn vị','hàng chục','hàng trăm','hàng nghìn','chữ số','giá trị','phần mười','phần trăm','dấu thập phân','số thập phân','đổi hàng','ước','tích','đa giác','cạnh','đỉnh'];
var INF_EN=['bigger','smaller','borrow','carry','flip','reduce','top number','bottom number','thing','stuff','this one','that one','it is big'];
var INF_VI=['to hơn','bé hơn','mượn','số trên','số dưới','cái này','cái kia','cái đó','thứ này'];
function analyze(txt){
  var low=txt.toLowerCase(),hits=[];
  function scan(arr,cls){arr.forEach(function(w){var i=0;while((i=low.indexOf(w,i))>=0){hits.push({s:i,e:i+w.length,c:cls,w:w});i+=w.length;}});}
  scan(VOC_EN.concat(VOC_VI),'hi');scan(INF_EN.concat(INF_VI),'lo');
  hits.sort(function(a,b){return a.s-b.s||(b.e-b.s)-(a.e-a.s);});
  var out=[],last=0,good={},bad={};
  hits.forEach(function(h){if(h.s<last)return;out.push(esc(txt.slice(last,h.s)));out.push('<span class="'+h.c+'">'+esc(txt.slice(h.s,h.e))+'</span>');(h.c==='hi'?good:bad)[h.w]=1;last=h.e;});
  out.push(esc(txt.slice(last)));
  return {html:out.join('').replace(/\n/g,'<br>'),good:Object.keys(good),bad:Object.keys(bad)};
}

function btCompute(){var b=w2.bt,A=dg(b.a),B=dg(b.b),st=[],r={};

  else{var f=A.f,rr=A.r,u=A.u,un=[];while(u<B.u){if(rr===0){f--;rr=10;un.push('f');}rr--;u+=10;un.push('r');}while(rr<B.r){f--;rr+=10;un.push('f');}r={A:A,B:B,top:{f:f,r:rr,u:u},un:un,fin:{f:f-B.f,r:rr-B.r,u:u-B.u},res:b.a-b.b};}
  return r;}

    else if(st===2){svgs='<div><b>'+P('Sau khi đổi hàng','After regrouping')+'</b> '+blocks(c.fin.f,c.fin.r,c.fin.u)+'</div>';note=(c.cu||c.cr)?T((c.cu?'10 ô nhỏ đổi thành 1 thanh ('+c.cu+' lần). ':'')+(c.cr?'10 thanh đổi thành 1 tấm ('+c.cr+' lần). ':'')+'Có đổi hàng.','Regrouping happened: '+(c.cu?'10 units → 1 rod ('+c.cu+'×). ':'')+(c.cr?'10 rods → 1 flat ('+c.cr+'×).':'')):T('Không cần đổi hàng.','No regrouping needed.');}
    else{svgs='<div>'+blocks(c.fin.f,c.fin.r,c.fin.u)+'</div>';note=T('Khai triển: '+d2(b.a)+' = '+exp(b.a)+'; '+d2(b.b)+' = '+exp(b.b)+'. Tổng = '+exp(res)+' = <b>'+d2(res)+'</b>.','Expanded: '+d2(b.a)+' = '+exp(b.a)+'; '+d2(b.b)+' = '+exp(b.b)+'. Sum = '+exp(res)+' = <b>'+d2(res)+'</b>.')+'<br>'+T('Nối biểu diễn: '+c.fin.f+' tấm ↔ '+c.fin.f+'; '+c.fin.r+' thanh ↔ '+dec(c.fin.r/10,1)+'; '+c.fin.u+' ô nhỏ ↔ '+dec(c.fin.u/100,2)+'.','Connect: '+c.fin.f+' flats ↔ '+c.fin.f+'; '+c.fin.r+' rods ↔ '+dec(c.fin.r/10,1)+'; '+c.fin.u+' units ↔ '+dec(c.fin.u/100,2)+'.');}

/* ---------- tab 4: Is it True? routine ---------- */
function F(n,d){return {t:'f',n:n,d:d,v:n/d,txt:n+'/'+d,html:function(){return fr(n,d);}};}
function Dm(x){return {t:'d',v:x,txt:null,html:function(){return dec(x,2);}};}
function tv(s){return s.a.v<s.b.v?'<':s.a.v>s.b.v?'>':'=';}
function eq(a,b){return Math.abs(a-b)<1e-9;}
var SETS=[
 {vi:'Bộ phân số: so sánh và bằng nhau',en:'Fractions: comparison and equivalence',stmts:[{a:F(3,4),op:'<',b:F(5,8)},{a:F(1,2),op:'=',b:F(2,4)},{a:F(2,3),op:'>',b:F(3,5)},{a:F(3,8),op:'=',b:F(1,3)},{a:F(5,6),op:'<',b:F(7,8)}]},
 {vi:'Bộ số thập phân: so sánh',en:'Decimals: comparison',stmts:[{a:Dm(0.4),op:'>',b:Dm(0.35)},{a:Dm(0.09),op:'>',b:Dm(0.1)},{a:Dm(0.6),op:'=',b:Dm(0.60)},{a:Dm(1.25),op:'<',b:Dm(1.3)},{a:Dm(2.5),op:'=',b:Dm(2.05)}]}];
SETS.forEach(function(s){s.stmts.forEach(function(x){x.truth=(tv(x)===x.op);});});
function stHTML(x){return x.a.html()+' <b style="font-size:1.2em">'+x.op+'</b> '+x.b.html();}
function v3(){
  return hero('Routine: Có đúng không? (Is it True?)','Routine: Is it True?','Dự đoán một phát biểu so sánh là đúng hay sai, dùng biểu diễn để kiểm chứng, giải thích bằng từ vựng toán, rồi sửa phát biểu sai thành đúng.','Predict whether a comparison statement is true, use representations to check it, explain with math vocabulary, then change a false statement to make it true.')+
  panel(T('Routine 3 bước (30–40 phút)','The 3-step routine (30–40 min)'),TK.stepList([
   {vi:'<b>Dự đoán, biểu diễn, so sánh</b> — đọc thầm phát biểu (chưa đọc to số); giơ thẻ Đúng/Sai; rồi biểu diễn bằng khối, mảnh phân số hoặc hình vẽ và kết luận. Được đổi dự đoán nếu cần.',en:'<b>Predict, represent, compare</b> — read the statement silently (do not read numbers aloud); hold up True/False; then represent with blocks, tiles or drawings and conclude. Students may change their prediction.',tm:'~10′'},
   {vi:'<b>Chỉ và giải thích</b> — theo cặp rồi cả lớp: “Phát biểu này ___ vì …”, dùng 1–2 từ trong bảng từ vựng và chỉ vào mô hình.',en:'<b>Show and explain</b> — pairs, then whole group: “The statement is ___ because…”, using 1–2 vocabulary words and pointing to the model.',tm:'~10′'},
   {vi:'<b>Làm cho đúng!</b> (chỉ với phát biểu sai) — đổi dấu; rồi đổi một số hoặc đổi cả dấu và số; “Chúng em làm cho đúng bằng cách đổi ___ thành ___ vì …”.',en:'<b>Make it True!</b> (false statements only) — change the symbol; then change a number, or a number and the symbol: “We made the statement true by changing ___ to ___ because…”.',tm:'10–15′'}])+
   callout(T('Nên bắt đầu bằng một phát biểu sai để làm đủ cả 3 bước. Học sinh cần đã học chủ đề (phân số hoặc số thập phân), biết dấu &lt; &gt; và đã quen loại biểu diễn dùng.','Start with a false statement so you can do all three steps. Students need prior experience with the topic, the symbols &lt; &gt;, and the chosen representation.')))+
  panel(T('Mô phỏng: bạn đóng vai học sinh','Simulator: you play the student'),'<div class="row" id="w2-sets" style="margin-bottom:12px"></div><div id="w2-sim"></div>')+done();
}
function simNew(){w2.sim={i:0,phase:'predict',pred:null,f:{a:{n:0,d:4,f:0,r:0,u:0},b:{n:0,d:4,f:0,r:0,u:0}},concl:null,voc:{},method:'sym'};}
function bindSim(){simNew();renderSim();}
function curSet(){return SETS[w2.set];}
function sideBuild(side,x,key){
  var m=w2.sim.f[key];
  if(x.t==='f')return '<div class="info" style="grid-template-columns:1fr"><div><b>'+key.toUpperCase()+'</b><div class="row"><label class="f" for="w2-d'+key+'"><span>'+P('Mẫu số','Denominator')+'</span><select id="w2-d'+key+'" data-side="'+key+'" data-kind="d">'+[2,3,4,5,6,8,10,12].map(function(d){return '<option value="'+d+'"'+(d===m.d?' selected':'')+'>'+d+'</option>';}).join('')+'</select></label><label class="f" for="w2-n'+key+'" style="flex:1"><span>'+P('Tô bao nhiêu phần','Parts shaded')+'</span><input type="range" id="w2-n'+key+'" min="0" max="'+m.d+'" value="'+m.n+'" data-side="'+key+'" data-kind="n"></label></div><div id="w2-m'+key+'">'+fbar(m.n,m.d,300,26)+' <b>'+m.n+'/'+m.d+'</b></div></div></div>';
  return '<div class="info" style="grid-template-columns:1fr"><div><b>'+key.toUpperCase()+'</b><div class="row">'+[['f','tấm (1)','flats (1)'],['r','thanh (0,1)','rods (0.1)'],['u','ô nhỏ (0,01)','units (0.01)']].map(function(p){return '<label class="f" for="w2-'+p[0]+key+'"><span>'+P(p[1],p[2])+'</span><input type="number" id="w2-'+p[0]+key+'" min="0" max="'+(p[0]==='f'?3:12)+'" value="'+m[p[0]]+'" data-side="'+key+'" data-kind="'+p[0]+'" style="max-width:76px"></label>';}).join('')+'</div><div id="w2-m'+key+'">'+blocks(m.f,m.r,m.u)+' <b>'+d2(m.f*100+m.r*10+m.u)+'</b></div></div></div>';}
function modelVal(x,m){return x.t==='f'?m.n/m.d:(m.f*100+m.r*10+m.u)/100;}
function renderSim(){
  $('#w2-sets').innerHTML=SETS.map(function(s,i){return '<button class="btn sm'+(i===w2.set?' pri':'')+'" data-act="m2set" data-i="'+i+'">'+I(s.vi,s.en)+'</button>';}).join('');
  var sm=w2.sim,set=curSet(),x=set.stmts[sm.i],h='';
  var flow=['predict','represent','explain','make'],labs=[['1 · Dự đoán','1 · Predict'],['1 · Biểu diễn','1 · Represent'],['2 · Giải thích','2 · Explain'],['3 · Làm cho đúng','3 · Make it true']];
  h+='<div class="row" style="justify-content:space-between"><span class="chip">'+P('Phát biểu','Statement')+' '+(sm.i+1)+' / '+set.stmts.length+'</span></div><div class="flow">'+flow.map(function(f,i){var cls=f===sm.phase?'on':(flow.indexOf(sm.phase)>i?'done':'');return '<span class="'+cls+'">'+P(labs[i][0],labs[i][1])+'</span>';}).join('')+'</div><div style="text-align:center;margin:12px 0"><div class="cardbig" style="font-size:34px">'+stHTML(x)+'</div></div>';
  if(sm.phase==='predict'){h+='<p style="text-align:center;font-weight:600">'+T('Đọc thầm. Chưa tính, chưa vẽ: phát biểu này đúng hay sai?','Read silently. Do not calculate or draw yet: is the statement true or false?')+'</p><div class="row" style="justify-content:center"><button class="btn pri" data-act="m2pred" data-v="1">'+I('Đúng','True')+'</button><button class="btn pri" data-act="m2pred" data-v="0">'+I('Sai','False')+'</button></div>';}
  else if(sm.phase==='represent'){
    h+='<p style="font-weight:600">'+T('Biểu diễn hai bên của phát biểu bằng '+(x.a.t==='f'?'thanh phân số':'khối cơ số mười')+', rồi so sánh.','Represent both sides of the statement with '+(x.a.t==='f'?'fraction bars':'base ten blocks')+', then compare.')+'</p><div class="grid2">'+sideBuild('a',x.a,'a')+sideBuild('b',x.b,'b')+'</div><div id="w2-cmp" style="margin:8px 0"></div><p style="font-weight:600">'+T('Kết luận của bạn:','Your conclusion:')+'</p><div class="row"><button class="btn pri" data-act="m2concl" data-v="1">'+I('Đúng','True')+'</button><button class="btn pri" data-act="m2concl" data-v="0">'+I('Sai','False')+'</button></div><div id="w2-fb" style="margin-top:8px"></div>';}
  else if(sm.phase==='explain'){
    var vocab=x.a.t==='f'?['less than','greater than','equivalent','numerator','denominator','compare']:['less than','greater than','equal','tenths','hundredths','place value'];
    h+=callout('<b>'+(sm.concl===x.truth?P('Đúng. ','Correct. '):P('Chưa đúng. ','Not quite. '))+'</b>'+T('Phát biểu này '+(x.truth?'đúng':'sai')+'. '+(x.a.t==='f'?fr(x.a.n,x.a.d)+' ≈ '+dec(x.a.v,3)+' và '+fr(x.b.n,x.b.d)+' ≈ '+dec(x.b.v,3)+'.':dec(x.a.v,2)+' và '+dec(x.b.v,2)+' — so từng hàng từ trái sang phải.'),'The statement is '+(x.truth?'true':'false')+'. '+(x.a.t==='f'?fr(x.a.n,x.a.d)+' ≈ '+dec(x.a.v,3)+' and '+fr(x.b.n,x.b.d)+' ≈ '+dec(x.b.v,3)+'.':dec(x.a.v,2)+' and '+dec(x.b.v,2)+' — compare place by place from the left.')),sm.concl!==x.truth)+
     (sm.pred!==null&&sm.pred!==sm.concl?'<p style="font-size:13px;color:var(--muted)">'+T('Bạn đã đổi ý so với dự đoán — mô hình giúp bạn kiểm chứng.','You changed your mind after modelling — the representation did its job.')+'</p>':'')+
     '<p style="font-weight:600">'+T('Phát biểu này ___ vì …  (chọn 1–2 từ vựng và chỉ vào mô hình)','The statement is ___ because…  (pick 1–2 vocabulary words and point to the model)')+'</p><div class="row">'+vocab.map(function(k){return '<button class="chipbtn" aria-pressed="'+(sm.voc[k]?'true':'false')+'" data-act="m2voc" data-k="'+k+'">'+k+'</button>';}).join('')+'</div><label class="f" for="w2-why" style="margin-top:8px"><span>'+T('Lời giải thích của bạn','Your explanation')+'</span><textarea id="w2-why" rows="2"></textarea></label><div class="row end" style="margin-top:10px"><button class="btn pri" data-act="m2explain">'+I(x.truth?'Xong phát biểu này':'Sang bước “Làm cho đúng”',x.truth?'Done with this statement':'On to “Make it True”')+'</button></div>';}
  else{
    h+='<div class="callout warn"><b>'+P('Phát biểu sai.','The statement is false.')+'</b> '+T('Hãy làm cho nó đúng bằng một trong ba cách.','Make it true in one of three ways.')+'</div><div class="row" style="margin-bottom:8px">'+[['sym','Đổi dấu','Change the symbol'],['num','Đổi một số','Change a number'],['both','Đổi số và dấu','Change a number and the symbol']].map(function(m){return '<label class="chipbtn" aria-pressed="'+(sm.method===m[0]?'true':'false')+'"><input type="radio" name="w2m" value="'+m[0]+'" data-act="m2method" style="display:none"'+(sm.method===m[0]?' checked':'')+'> '+P(m[1],m[2])+'</label>';}).join('')+'</div>'+
     '<div class="row"><label class="f" for="w2-ns"><span>'+T('Dấu mới','New symbol')+'</span><select id="w2-ns" style="max-width:90px"><option>&lt;</option><option>&gt;</option><option>=</option></select></label><label class="f" for="w2-nb"><span>'+T('Giá trị mới của vế phải','New right-hand value')+' ('+(x.a.t==='f'?'a/b':'0,00')+')</span><input type="text" id="w2-nb" style="max-width:140px" placeholder="'+(x.a.t==='f'?'3/4':'0,45')+'"></label><button class="btn pri" data-act="m2make">'+I('Kiểm tra','Check')+'</button></div><div id="w2-mk" style="margin-top:8px"></div><p style="font-size:13px;color:var(--muted)">'+T('Câu mẫu: “Chúng em làm cho đúng bằng cách đổi ___ thành ___ vì …”.','Frame: “We made the statement true by changing ___ to ___ because…”.')+'</p>';}
  h+='<div class="row end" style="margin-top:8px">'+(sm.i+1<set.stmts.length?'<button class="btn" data-act="m2skip">'+I('Phát biểu tiếp theo','Next statement')+' →</button>':'<button class="btn" data-act="m2retry">'+I('Chơi lại bộ này','Replay this set')+'</button>')+'</div>';
  $('#w2-sim').innerHTML=h;
  if(sm.phase==='represent')bindBuild();
}
function bindBuild(){
  var sm=w2.sim,x=curSet().stmts[sm.i];
  function upd(){['a','b'].forEach(function(k){var m=sm.f[k],xx=x[k];var box=$('#w2-m'+k);box.innerHTML=xx.t==='f'?fbar(m.n,m.d,300,26)+' <b>'+m.n+'/'+m.d+'</b>':blocks(m.f,m.r,m.u)+' <b>'+d2(m.f*100+m.r*10+m.u)+'</b>';});
    var va=modelVal(x.a,sm.f.a),vb=modelVal(x.b,sm.f.b);$('#w2-cmp').innerHTML='<span class="chip">'+P('Mô hình của bạn: A','Your model: A')+' '+(va<vb?'<':va>vb?'>':'=')+' B</span>';}
  $$('[data-side]').forEach(function(el){el.addEventListener('input',function(){var m=sm.f[el.getAttribute('data-side')],kd=el.getAttribute('data-kind');m[kd]=+el.value;if(kd==='d'){var nr=$('#w2-n'+el.getAttribute('data-side'));nr.max=m.d;m.n=Math.min(m.n,m.d);nr.value=m.n;}upd();});el.addEventListener('change',function(){if(el.tagName==='SELECT'){var m=sm.f[el.getAttribute('data-side')];m.d=+el.value;var nr=$('#w2-n'+el.getAttribute('data-side'));nr.max=m.d;m.n=Math.min(m.n,m.d);nr.value=m.n;upd();}});});
  upd();}
function $$(s){return TK.$$(s);}
ACT.m2set=function(el){w2.set=+el.getAttribute('data-i');simNew();renderSim();};
ACT.m2pred=function(el){w2.sim.pred=el.getAttribute('data-v')==='1';w2.sim.phase='represent';renderSim();};
ACT.m2concl=function(el){var sm=w2.sim,x=curSet().stmts[sm.i],c=el.getAttribute('data-v')==='1',ma=modelVal(x.a,sm.f.a),mb=modelVal(x.b,sm.f.b);
  if(!(Math.abs(ma-x.a.v)<1e-9&&Math.abs(mb-x.b.v)<1e-9)){$('#w2-fb').innerHTML=callout(T('Mô hình của bạn chưa khớp với các số trong phát biểu. Kiểm tra lại từng vế (A = '+(x.a.t==='f'?x.a.n+'/'+x.a.d:d2(x.a.v*100))+', B = '+(x.b.t==='f'?x.b.n+'/'+x.b.d:d2(x.b.v*100))+').','Your model does not match the numbers in the statement yet. Check each side (A = '+(x.a.t==='f'?x.a.n+'/'+x.a.d:d2(x.a.v*100))+', B = '+(x.b.t==='f'?x.b.n+'/'+x.b.d:d2(x.b.v*100))+').'),true);return;}
  sm.concl=c;sm.phase='explain';renderSim();};
ACT.m2voc=function(el){var sm=w2.sim,k=el.getAttribute('data-k');sm.voc[k]=!sm.voc[k];el.setAttribute('aria-pressed',sm.voc[k]?'true':'false');};
ACT.m2explain=function(){var sm=w2.sim,x=curSet().stmts[sm.i],used=Object.keys(sm.voc).filter(function(k){return sm.voc[k];});
  if(!used.length){TK.toast(P('Chọn ít nhất một từ vựng','Pick at least one vocabulary word'));return;}
  if(x.truth){ACT.m2skip();}else{sm.phase='make';renderSim();}};
ACT.m2method=function(el){w2.sim.method=el.value;$$('label.chipbtn').forEach(function(l){var r=l.querySelector('input');if(r)l.setAttribute('aria-pressed',r.checked?'true':'false');});};
function parseVal(s,isFrac){s=(s||'').trim().replace(',','.');if(isFrac){var m=/^(\d+)\s*\/\s*(\d+)$/.exec(s);return m&&+m[2]>0?{v:+m[1]/+m[2],txt:m[1]+'/'+m[2]}:null;}var v=parseFloat(s);return isNaN(v)?null:{v:v,txt:s};}
ACT.m2make=function(){var sm=w2.sim,x=curSet().stmts[sm.i],isF=x.a.t==='f',ns=$('#w2-ns').value,nbraw=$('#w2-nb').value.trim(),nb=nbraw?parseVal(nbraw,isF):null,m=sm.method,fb=$('#w2-mk');
  var sym=ns==='<'?'<':ns==='>'?'>':'=',bv=nb?nb.v:x.b.v,changedNum=nb&&Math.abs(bv-x.b.v)>1e-9,changedSym=sym!==x.op;
  var truthNow=(x.a.v<bv?'<':x.a.v>bv?'>':'=')===sym;
  var okMethod=(m==='sym'&&changedSym&&!changedNum)||(m==='num'&&changedNum&&!changedSym)||(m==='both'&&changedNum&&changedSym);
  if(nbraw&&!nb){fb.innerHTML=callout(T('Không đọc được giá trị mới.','Could not read the new value.'),true);return;}
  if(!truthNow)fb.innerHTML=callout(T('Phát biểu mới vẫn sai. Thử lại và dùng mô hình để kiểm tra.','The new statement is still false. Try again and check with your model.'),true);
  else if(!okMethod)fb.innerHTML=callout(T('Phát biểu mới đúng, nhưng chưa theo cách bạn chọn ('+(m==='sym'?'chỉ đổi dấu':m==='num'?'chỉ đổi một số':'đổi cả số và dấu')+').','The new statement is true, but not by the method you chose ('+(m==='sym'?'change only the symbol':m==='num'?'change only a number':'change both')+').'),true);
  else fb.innerHTML=callout('<b>'+P('Đúng rồi!','Yes!')+'</b> '+T('Chúng em làm cho đúng bằng cách '+(m==='sym'?'đổi dấu thành '+sym:m==='num'?'đổi vế phải thành '+(nb?nb.txt:''):'đổi vế phải thành '+(nb?nb.txt:'')+' và dấu thành '+sym)+'.','We made the statement true by '+(m==='sym'?'changing the symbol to '+sym:m==='num'?'changing the right side to '+(nb?nb.txt:''):'changing the right side to '+(nb?nb.txt:'')+' and the symbol to '+sym)+'.'));};
ACT.m2skip=function(){var sm=w2.sim,set=curSet();if(sm.i+1<set.stmts.length){var i=sm.i+1;simNew();w2.sim.i=i;}renderSim();};
ACT.m2retry=function(){simNew();renderSim();};
/* ---------- module ---------- */
TK.regMod({id:2,key:'m2',nav:['Biểu diễn','Representations'],sub:'Module 2',short:['Module 2 · Biểu diễn'],title:['Module 2 · Biểu diễn','Module 2 · Representations'],
 cfg:{
  topic:['biểu diễn','representations'],
  introTitle:['Dùng biểu diễn cụ thể và bán cụ thể như “công cụ suy nghĩ”','Use concrete and semi-concrete representations as “thinking tools”'],
  introLede:['Khối, mảnh phân số, hình vẽ giúp học sinh hiểu vì sao phép toán hoạt động. Module này luyện chọn biểu diễn, nối với ký hiệu, và dùng chúng để giải thích.','Blocks, tiles and drawings help students see why procedures work. This module practises choosing representations, connecting them to notation and using them to explain.'],
  rec:'Use a well-chosen set of concrete and semi-concrete representations to support students’ learning of mathematical concepts and procedures.',pages:'pp. 21–28',recVi:'Bản dịch tham khảo: Dùng một bộ biểu diễn cụ thể và bán cụ thể được chọn kỹ để hỗ trợ học khái niệm và quy trình toán.',
  impl:[['Cung cấp biểu diễn cụ thể và bán cụ thể thể hiện hiệu quả khái niệm hay quy trình đang học.','Provide concrete and semi-concrete representations that effectively represent the concept or procedure.'],['Khi dạy khái niệm và quy trình, nối biểu diễn cụ thể và bán cụ thể với biểu diễn trừu tượng.','When teaching concepts and procedures, connect concrete and semi-concrete representations to abstract ones.'],['Tạo nhiều cơ hội có ý nghĩa để học sinh dùng biểu diễn như “công cụ suy nghĩ”.','Provide ample, meaningful opportunities to use representations as “thinking tools”.'],['Định kỳ quay lại biểu diễn cụ thể và bán cụ thể để củng cố và làm sâu hiểu biết.','Periodically revisit concrete and semi-concrete representations to reinforce and deepen understanding.']],
  strategies:[{h:['Chọn biểu diễn cẩn thận','Carefully select representations'],t:['Với phân số, dùng vật dụng tỉ lệ để các mảnh thể hiện đúng độ lớn tương đối.','For fractions use proportional manipulatives so pieces show true relative sizes.']},{h:['Nối các biểu diễn','Connect representations'],t:['Đặt câu hỏi dẫn dắt để học sinh thấy biểu diễn cụ thể nối với ký hiệu ra sao.','Ask guiding questions so students see how concrete and semi-concrete representations connect to notation.']},{h:['Dùng biểu diễn như công cụ suy nghĩ','Use representations as thinking tools'],t:['Làm mẫu cách dùng biểu diễn để suy nghĩ; mời học sinh chia sẻ cách làm.','Model how to use representations to think; have students share their approaches.']},{h:['Quay lại biểu diễn','Revisit representations'],t:['Luôn để sẵn vật dụng (ví dụ hộp khối) để học sinh chọn dùng khi cần.','Keep manipulatives available (e.g. bins) so students can choose them as needed.']}],

 {vi:'Trên trục số từ 0 đến 1, phân số '+fr(3,8)+' nằm ở đâu?',en:'On a 0-to-1 number line, where does '+fr(3,8)+' go?',

 {vi:'Dùng phân số như phép toán: số nào lớn hơn, '+fr(2,3)+' của 18 hay '+fr(5,4)+' của 8?',en:'Fractions as operators: which is greater, '+fr(2,3)+' of 18 or '+fr(5,4)+' of 8?',

function bindPlace(){
  var sim=w3.sim,set=simSet(),svg=$('#simsvg'),rng=$('#simrng'),drag=false;

  function fromEv(e){var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1000;return (x-NL.L)/(NL.R-NL.L)*set.max;}
  svg.addEventListener('pointerdown',function(e){drag=true;try{svg.setPointerCapture(e.pointerId);}catch(x){}setPos(fromEv(e));});
  svg.addEventListener('pointermove',function(e){if(drag)setPos(fromEv(e));});
  svg.addEventListener('pointerup',function(){drag=false;});svg.addEventListener('pointercancel',function(){drag=false;});

}

  panel(T('Routine 5 bước (đề xuất)','The 5-step routine (adapted)'),TK.stepList([
   {vi:'<b>Đọc và gọi tên dạng bài</b> — đọc câu chuyện đủ đại lượng, rồi bài toán thiếu một đại lượng; hỏi “bài này về điều gì, hỏi gì, dạng gì?”.',en:'<b>Read and name the type</b> — read the story with all quantities, then the word problem with one missing; ask “What is it about? What is asked? Which type?”.',tm:'~5′'},

   callout(T('Lưu ý: Module 4 trên Toolkit không có workbook công khai; routine này được dựng lại từ khuyến nghị số 5 của WWC và mô tả module trong Leader Guide. Hãy đối chiếu với video routine trên trang Module 4.','Note: the Toolkit’s Module 4 has no public workbook; this routine is adapted from WWC Recommendation 5 and the Leader Guide’s module description. Compare it with the routine videos on the Module 4 page.'),true))+

ACT.m4prob=function(el){simNew(+el.getAttribute('data-i'));renderSim();};
ACT.m4toact=function(){w4.sim.phase='act';w4.sim.ast=0;w4.sim.mat={};w4.sim.boxes=0;renderSim();};
ACT.m4mat=function(el){var sm=w4.sim,k=el.getAttribute('data-k'),d=+el.getAttribute('data-d');sm.mat[k]=clamp((sm.mat[k]||0)+d,0,60);renderSim();};
ACT.m4mbox=function(el){var sm=w4.sim;sm.boxes=clamp(sm.boxes+(+el.getAttribute('data-v')),0,12);renderSim();};
ACT.m4actcheck=function(){var sm=w4.sim,p=curP(),st=p.act[sm.ast],ok=true;
  if(st.r)st.r.forEach(function(row,ri){if((sm.mat[sm.ast+'_'+ri]||0)!==row[2])ok=false;});else ok=(sm.boxes*st.boxes.per===st.boxes.total);
  if(!ok){$('#m4-fb').innerHTML=callout(T('Chưa khớp với câu chuyện. Đọc lại và kiểm tra số hạt.','It does not match the story yet. Reread and check the counters.'),true);return;}
  if(sm.ast+1<p.act.length){sm.ast++;sm.mat={};}else{sm.phase='rep';}renderSim();};
ACT.m4repcheck=function(){var sm=w4.sim,p=curP(),ok=true,fb=$('#m4-fb'),unkCount=0;
  p.c.vals.forEach(function(v,i){var e=($('#m4-r'+i).value||'').trim();sm.rep[i]=e;if(i===p.u){if(e!=='?')ok=false;unkCount++;}else if(e!==String(v))ok=false;});
  if(!ok){fb.innerHTML=callout(T('Chưa đúng. Đại lượng chưa biết là “'+p.c.lab[p.u][0]+'” (ghi ?). Các đại lượng còn lại lấy từ câu chuyện.','Not yet. The unknown is the “'+p.c.lab[p.u][1]+'” (write ?). The other quantities come from the story.'),true);return;}
  sm.done.rep=true;$('#m4-dia').innerHTML=diagram(p.t,p.c,p.u);fb.innerHTML=callout('<b>'+P('Đúng.','Correct.')+'</b> '+T('Hỏi: Số '+p.c.vals[(p.u+1)%3]+' nằm ở đâu trong hình vẽ và trong phương trình? Phương trình: <span style="font-family:var(--mono)">'+p.t.eq(p.c.vals.map(function(a,i){return i===p.u?'?':a;}),p.c)+'</span>','Ask: where is the number '+p.c.vals[(p.u+1)%3]+' in the drawing and in the equation? Equation: <span style="font-family:var(--mono)">'+p.t.eq(p.c.vals.map(function(a,i){return i===p.u?'?':a;}),p.c)+'</span>'))+'<div class="row end"><button class="btn pri" data-act="m4tosolve">'+I('Sang bước giải','On to solving')+' →</button></div>';};
ACT.m4tosolve=function(){w4.sim.phase='solve';renderSim();};
ACT.m4solve=function(){var sm=w4.sim,p=curP(),fb=$('#m4-fb');sm.eq=$('#m4-eq').value.trim();sm.ans=$('#m4-ans').value.trim();sm.unit=$('#m4-unit').value.trim();
  var a=parseFloat(sm.ans.replace(',','.'));
  if(isNaN(a)||a!==p.ans){fb.innerHTML=callout(T('Đáp án chưa đúng. Dùng hạt đếm hoặc sơ đồ để kiểm tra lại.','The answer is not right yet. Check again with the counters or the diagram.'),true);return;}
  if(!sm.unit){fb.innerHTML=callout(T('Hãy ghi nhãn (đơn vị) cho đáp án.','Add a label (unit) to the answer.'),true);return;}
  if(sm.eq.indexOf('=')<0){fb.innerHTML=callout(T('Hãy viết một phương trình có dấu =.','Write an equation with an = sign.'),true);return;}
  sm.phase='check';renderSim();};
ACT.m4chk=function(el){var sm=w4.sim;if(sm.chk!==null)return;sm.chk=+el.getAttribute('data-i');renderSim();};
ACT.m4nextp=function(){simNew(w4.sim.i+1);renderSim();};

function fillRanks(){var op=w5.op,sel=$('#m5-gr');sel.innerHTML=Object.keys(RANKS[op]).map(function(k){return '<option value="'+k+'"'+(+k===w5.gen.rank?' selected':'')+'>'+k+' · '+esc(P(RANKS[op][k][0],RANKS[op][k][1]))+'</option>';}).join('');sel.onchange=function(){w5.gen.rank=+sel.value;};if(!RANKS[op][w5.gen.rank]){w5.gen.rank=1;}}
function genOne(op,rank){
  for(var t=0;t<600;t++){var d1=DEN[rnd(0,7)],d2=DEN[rnd(0,7)],p;
    if(rank>=7){var w1=rnd(1,3),w2=rnd(1,3);d2=d1;if(rank>=7&&Math.random()<0.5)d2=DEN[rnd(0,7)];p={op:op,a:{w:w1,n:rnd(1,d1-1),d:d1,v:0},b:{w:w2,n:rnd(1,d2-1),d:d2,v:0},line:''};if(op==='sub'&&w1<w2){var tmp=p.a;p.a=p.b;p.b=tmp;}p.a.v=p.a.w+p.a.n/p.a.d;p.b.v=p.b.w+p.b.n/p.b.d;}
    else if(rank===6){var big=rnd(0,1);p={op:op,a:{w:0,n:big?rnd(d1+1,2*d1-1):rnd(1,d1-1),d:d1,v:0},b:{w:0,n:big?rnd(1,d2-1):rnd(d2+1,2*d2-1),d:d2,v:0},line:''};if(op==='sub'&&p.a.n/p.a.d<p.b.n/p.b.d){var t2=p.a;p.a=p.b;p.b=t2;}p.a.v=p.a.n/p.a.d;p.b.v=p.b.n/p.b.d;}
    else if(rank===2&&op==='sub'){p={op:op,a:{w:1,n:0,d:1,v:1},b:{w:0,n:rnd(1,d2-1),d:d2,v:0},line:''};p.b.v=p.b.n/p.b.d;}
    else{var n1=rnd(1,d1-1),n2=rnd(1,d2-1);if(op==='cmp'&&rank===2){d2=DEN[rnd(0,7)];n2=n1;}
      p={op:op,a:{w:0,n:n1,d:d1,v:n1/d1},b:{w:0,n:n2,d:d2,v:n2/d2},line:''};if(op==='sub'&&p.a.v<p.b.v){var t3=p.a;p.a=p.b;p.b=t3;}}
    if(p.a.d===p.b.d&&op==='cmp'&&rank!==1)continue;
    if(op==='cmp'&&p.a.v===p.b.v)continue;
    if(op==='sub'&&p.a.v<=p.b.v)continue;
    if(classify(p)===rank)return p;}
  return null;}

var BASE=[['tử số','numerator'],['mẫu số','denominator'],['phân số nhỏ hơn 1','proper fraction'],['phân số lớn hơn 1','improper fraction'],['hỗn số','mixed number'],['phân số đơn vị (tử số bằng 1)','unit fraction'],['phân số không phải đơn vị','non-unit fraction'],['phân số bằng nhau','equivalent fractions'],['dạng tối giản','simplest form'],['số thập phân','decimal'],['phần trăm','percentage'],['trục số','number line'],['mốc (số mốc)','benchmark'],['mảnh phân số','fraction tile'],['độ lớn của số','magnitude'],['lớn hơn / nhỏ hơn','greater than / less than'],['phép toán (dùng phân số như phép toán)','operator'],['số hạng','addend'],['tổng','sum'],['hiệu','difference'],['số bị trừ','minuend'],['số trừ','subtrahend'],['quy đồng mẫu số','common denominator'],['mô hình diện tích','area model'],['nhân chéo','cross-multiplying'],['thẻ trả lời','response card'],['câu mở đầu','sentence starter'],['phiếu ra cửa','exit task'],['sinh hoạt nhóm chuyên môn (PLC)','Professional Learning Community (PLC)']];
function gview(){
  return '<div class="hero"><div class="tabtag">'+P('Thuật ngữ','Glossary')+'</div><h2>'+T('Thuật ngữ Anh–Việt','English–Vietnamese terms')+'</h2><p>'+T('Cách gọi bám theo sách Stage 6 bản song ngữ và bảng thuật ngữ của Toolkit. Bản tiếng Việt dùng dấu phẩy thập phân (0,75), nên app hiển thị dấu phẩy ở chế độ tiếng Việt.','Terms follow the bilingual Stage 6 book and the Toolkit glossary. The Vietnamese edition uses a decimal comma (0,75), so this app shows a comma in Vietnamese mode.')+'</p></div>'+
   '<div class="panel"><label class="f" for="gl-q"><span>'+T('Tìm thuật ngữ','Search terms')+'</span><input type="text" id="gl-q" placeholder="fraction, phân số, …"></label><div id="gl-list" style="margin-top:8px"></div></div>';
}
function gbind(){
  var all=BASE.concat(GL);
  function draw(){var q=($('#gl-q').value||'').toLowerCase();$('#gl-list').innerHTML=all.filter(function(g){return !q||g[0].toLowerCase().indexOf(q)>=0||g[1].toLowerCase().indexOf(q)>=0||(g[2]||'').toLowerCase().indexOf(q)>=0;}).map(function(g){return '<div class="gl-item"><b>'+esc(g[0])+'</b><span style="font-family:var(--mono);color:var(--muted)">'+esc(g[1])+(g[2]?'<br><span style="font-family:var(--sans);font-size:12.5px">'+esc(g[2])+'</span>':'')+'</span></div>';}).join('')||'<p>—</p>';}
  $('#gl-q').addEventListener('input',draw);draw();
}
TK.regMod({id:6,key:'gl',nav:['Thuật ngữ','Glossary'],sub:'A–Z',short:['Thuật ngữ'],title:['Thuật ngữ Anh–Việt','English–Vietnamese Glossary'],cfg:{},tabs:[{vi:'Thuật ngữ',en:'Glossary',tag:'Anh–Việt',view:gview,bind:gbind}]});
/* ---------- boot ---------- */
if(!TK.MODS[S.mod])S.mod=0;
if(location.hash==='#selftest'){
  var out=[],errs0=window.__errs.length;
  try{
    TK.MODS.forEach(function(m,mi){if(!m)return;S.mod=mi;m.tabs.forEach(function(t,ti){S.tabs[m.key]=ti;try{TK.render(true);out.push('ok '+m.key+':'+ti+' len='+document.getElementById('main').innerHTML.length);}catch(e){out.push('FAIL '+m.key+':'+ti+' '+e.message+' '+(e.stack||'').split('\n')[1]);}
      try{var iw=window.innerWidth,off=[];Array.prototype.forEach.call(document.querySelectorAll('#main *'),function(e){if(e.closest('.tw,.svgbox,.mods,.steps'))return;var r=e.getBoundingClientRect();if(r.right>iw+1&&r.width>0)off.push(e.tagName+'.'+(e.className&&e.className.baseVal===undefined?e.className:'')+' r='+Math.round(r.right));});if(off.length)out.push('  OVERFLOW '+m.key+':'+ti+' iw='+iw+' '+off.slice(0,3).join(' | '));}catch(e){}
      try{var d=document;Array.prototype.forEach.call(d.querySelectorAll('.q'),function(q){var b=q.querySelector('[data-act="ans"]');if(b)b.click();});var sb=d.querySelector('[data-act="sum"]');if(sb)sb.click();var ps=d.getElementById('pl-set');if(ps){for(var pi=0;pi<ps.options.length;pi++){ps.selectedIndex=pi;ps.dispatchEvent(new Event('input',{bubbles:true}));ps.dispatchEvent(new Event('change',{bubbles:true}));}}var db=d.querySelector('[data-act="done"]');if(db)db.click();var gb=d.querySelector('[data-act="go"][data-i]');}catch(e){out.push('  GENERIC FAIL '+m.key+':'+ti+' '+e.message);}
      if(window.__selftest&&window.__selftest[m.key+':'+ti]){try{window.__selftest[m.key+':'+ti]();out.push('  test ok '+m.key+':'+ti);}catch(e){out.push('  TEST FAIL '+m.key+':'+ti+' '+e.message+' '+(e.stack||'').split('\n').slice(0,3).join('|'));}}
    });});
    ['vi','en','both'].forEach(function(l){S.lang=l;S.mod=0;TK.render(true);out.push('lang '+l+' ok');});
  }catch(e){out.push('FATAL '+e.message);}
  out.push('errs='+(window.__errs.length-errs0)+' '+window.__errs.join(' || '));
  var pre=document.createElement('pre');pre.id='selftest';pre.textContent=out.join('\n');document.body.appendChild(pre);
}else{var hm=/^#m([0-9])t([0-9])/.exec(location.hash||'');if(hm){S.mod=+hm[1];S.tabs[TK.MODS[S.mod].key]=+hm[2];}TK.render();}
})();

</script>
